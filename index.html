<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dex://AnirudhNaveen</title>
    <script>
      ;(function () {
        var classes = { vintage: 'theme-vintage', modern: 'theme-modern', cyberpunk: 'theme-cyber' }
        var saved = null
        try {
          saved = localStorage.getItem('site-theme')
        } catch (e) {}
        document.documentElement.classList.add(classes[saved] || 'theme-modern')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
